[package]
name = "chat_backend"
version = "0.1.0"
edition = "2024"



[dependencies]
axum = {version="0.8.9",features=["ws"]}
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = {version = "1.0", features=["derive"]}
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros","tls-rustls"] }
tokio = {version = "1.53.1",features=["full"]}
uuid = { version = "1.12", features = ["v4","serde"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
base64 = "0.23.1"
serde_with = {version = "3.23.0",features=["base64"]}
serde_json = "1.0.151"
futures-util = "0.3.34"
